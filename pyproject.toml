[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "UP", "B"]   # import sorting, modern syntax (pyupgrade), likely bugs (bugbear)

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["gradio.Progress"]   # gr.Progress() as a default is how Gradio injects its progress bar

[tool.ruff.lint.per-file-ignores]
# vendored upstream code, kept verbatim: list defaults that are never mutated, an unused loop variable
"src/extractors/audio/_musicfm.py" = ["B006"]
"src/evaluation/dc_utils.py" = ["B007"]
